<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jehiah's Diary</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pink: #ffe4e8;
      --card-bg: #ffffff;
      --accent-pink: #ff758f;
      --text-dark: #5c3d46;
      --text-muted: #8c6874;
      --overlay-bg: rgba(92, 61, 70, 0.85); /* For modal background */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-pink);
      background-image: radial-gradient(#ffb3c1 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Navigation Header */
    header {
      width: 100%;
      background-color: var(--card-bg);
      border-bottom: 2px solid #ffccd5;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(255, 117, 143, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-family: 'Sacramento', cursive;
      font-size: 2.2rem;
      color: var(--accent-pink);
      text-decoration: none;
      font-weight: bold;
    }

    .header-nav {
      display: flex;
      gap: 20px;
    }

    .header-nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    .header-nav a:hover {
      color: var(--accent-pink);
    }

    /* Main Container */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      width: 100%;
      flex-grow: 1;
    }

    /* Central Card */
    .diary-card {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(255, 117, 143, 0.25);
      border: 2px solid #ffccd5;
    }

    .icon-sparkle {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .diary-title {
      font-family: 'Sacramento', cursive;
      font-size: 3.2rem;
      color: var(--accent-pink);
      margin-bottom: 6px;
    }

    .diary-subtitle {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 16px;
    }

    .pink-line {
      width: 60px;
      height: 3px;
      background-color: var(--accent-pink);
      margin: 0 auto 20px auto;
      border-radius: 4px;
    }

    .diary-message {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 300;
      margin-bottom: 28px;
    }

    /* The Video Button (opens modal) */
    .video-button {
      display: inline-block;
      cursor: pointer;
      background-color: #ff5c8a;
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(255, 92, 138, 0.35);
      transition: all 0.3s ease;
      border: none;
    }

    .video-button:hover {
      background-color: #ff3366;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 92, 138, 0.5);
    }

    /* Modal (Video Popup) Styles */
    .modal {
      display: none; /* Hidden by default */
      position: fixed; 
      z-index: 1000; /* Sit on top of everything */
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%;
      background-color: var(--overlay-bg);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #000;
      margin: 10% auto; /* 10% from the top and centered */
      width: 80%; /* Width of the video box */
      max-width: 800px;
      border-radius: 16px;
      border: 3px solid #ffccd5;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Close Button for Modal */
    .close-modal {
      color: #fff;
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1010;
      transition: color 0.3s;
    }

    .close-modal:hover {
      color: var(--accent-pink);
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <a href="#" class="header-logo">Jehiah's Diary ✨</a>
    <nav class="header-nav">
      <a href="#">Home</a>
      <a href="#">Memories</a>
      <a href="#">About</a>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="container">
    <main class="diary-card">
      <div class="icon-sparkle">✨</div>
      <h1 class="diary-title">Jehiah's Diary</h1>
      <p class="diary-subtitle">Welcome to Jehiah's Diary!</p>
      <div class="pink-line"></div>
      <p class="diary-message">
        A little space where I share my life, memories, dreams, and the person I am becoming.
      </p>

      <!-- The Button to Open the Video -->
      <button class="video-button" id="openVideo">
        WATCH THE VIDEO 🎀 ▶
      </button>
    </main>
  </div>

  <!-- The Video Modal (Popup Window) -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeVideo">&times;</span>
      <div class="video-wrapper">
        <!-- The video loads here when the button is clicked -->
        <iframe id="videoPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- JavaScript to Handle the Video Popup -->
  <script>
    // Get the elements
    var modal = document.getElementById("videoModal");
    var btn = document.getElementById("openVideo");
    var span = document.getElementById("closeVideo");
    var video = document.getElementById("videoPlayer");

    // The direct embed link for your video (notice the /preview)
    var videoSrc = "https://drive.google.com/file/d/1rDXq1H-Th2jEXszoWWON_JlK-vHmuTp7/preview";

    // When the user clicks the button, open the modal and load the video
    btn.onclick = function() {
      modal.style.display = "block";
      video.src = videoSrc + "?autoplay=1"; // Add autoplay
    }

    // When the user clicks the (x), close the modal and stop the video
    span.onclick = function() {
      modal.style.display = "none";
      video.src = ""; // This stops the video
    }

    // When the user clicks anywhere outside of the video, close it
    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
        video.src = ""; // This stops the video
      }
    }
  </script>

</body>
</html>
